<div class="w-full max-w-sm rounded-xl border border-gray-200 bg-white p-5 shadow-sm">
  <h2 class="text-lg font-semibold text-gray-800">{{ title() }}</h2>
  <p class="mt-1 text-sm text-gray-500">
    {{ description() }}
  </p>
  <div class="mt-4 space-y-3">
    <!-- basic form fields just for learning purpose -->
    <!-- <app-form-fields label="Your Name" value=""></app-form-fields> -->

    <!-- advanced method get value-- -->
    <app-form-fields
      label="Your Name"
      type="email"
      (valueChange)="onSubmit($event)"
    ></app-form-fields>
    <div class="flex gap-2">
      <app-buttons label="clicked-1" (click)="clicked1()"></app-buttons>
      <app-buttons label="clicked-2" (click)="clicked2()"></app-buttons>
    </div>
  </div>
  <div class="mt-4 border-t pt-4">
    <ng-content></ng-content>
  </div>
</div>
