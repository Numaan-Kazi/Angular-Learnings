<p>signals-basic works!</p>

<div
  class="flex flex-col items-center gap-5 rounded-xl border border-gray-200 bg-white p-6 shadow-sm max-w-[400px] mx-auto"
>
  <p class="text-xl font-semibold text-gray-700">--Basic Counter--</p>
  <p class="text-xl font-semibold text-gray-700">
    Count: <span class="text-blue-600">{{ count() }}</span>
  </p>

  <div class="flex gap-3">
    <button
      type="button"
      (click)="decreament()"
      class="rounded-lg bg-red-500 px-5 py-2 text-lg font-semibold text-white"
    >
      Decrease
    </button>
    <button
      type="button"
      (click)="reset()"
      class="rounded-lg border border-gray-300 bg-gray-100 px-5 py-2 text-sm font-medium text-gray-700"
    >
      Reset
    </button>

    <button
      type="button"
      (click)="increament()"
      class="rounded-lg bg-blue-600 px-5 py-2 text-lg font-semibold text-white"
    >
      Increase
    </button>
  </div>
</div>
